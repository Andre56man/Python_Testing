<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>📊 Tableau des points des clubs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styleswel.css') }}">
    <style>
        body {
            font-family: 'PlusJakartaSans', Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 30px;
        }

        /* 3x3 card grid */
        .card-grid {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: minmax(120px, auto);
            gap: 16px;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            word-break: break-word;
        }

        .card h2 {
            margin: 0 0 6px 0;
            font-size: 1.05rem;
            color: #0b6b2f;
        }

        .card p {
            margin: 4px 0;
            color: #444;
            font-size: 0.95rem;
        }

        .card .points {
            font-weight: 700;
            color: #1b5e20;
            align-self: flex-end;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
        }

        a {
            color: #4CAF50;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* responsive: 1 column on small screens, 2 on medium */
        @media (max-width: 900px) {
            .card-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 560px) {
            .card-grid { grid-template-columns: repeat(1, 1fr); }
        }
    </style>
</head>
<body>

    <h1>Tableau des points des clubs</h1>

    <div class="card-grid" role="grid" aria-label="Tableau des points des clubs (3x3)">
        {% for club in clubs[:9] %}
        <div class="card" role="gridcell">
            <div>
                <h2>{{ club.name }}</h2>
                <p><strong>Email:</strong> {{ club.email }}</p>
            </div>
            <div class="points">Points: {{ club.points }}</div>
        </div>
        {% endfor %}
    </div>

    <div class="footer">
    <a href="{{ url_for('index') }}" 
       style="display: inline-block; 
              color: white; 
              background-color: green; 
              padding: 10px 15px; 
              font-size: 10px; 
              text-decoration: none; 
              border-radius: 5px; 
              cursor: pointer;
              hover: background-color: grey;">
        Connexion
    </a>
</div>


</body>
</html>
